name: Month planning schema

on:
  pull_request:
    branches: [main]
    paths:
      - "tests/schema/month-planning-contract.sql"
      - "src/app/api/month-planning/**"
      - "src/lib/month-planning.ts"
      - ".github/workflows/month-planning-schema.yml"
  push:
    branches: [main]
    paths:
      - "tests/schema/month-planning-contract.sql"
      - "src/app/api/month-planning/**"
      - "src/lib/month-planning.ts"
      - ".github/workflows/month-planning-schema.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outline
          POSTGRES_PASSWORD: outline
          POSTGRES_DB: outline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outline -d outline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: outline

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create base schedule schema
        run: |
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TYPE public.user_role AS ENUM ('admin', 'member');
          CREATE TABLE public.teams (
            "id" UUID PRIMARY KEY,
            "name" TEXT NOT NULL,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3)
          );
          CREATE TABLE public.users (
            "id" UUID PRIMARY KEY,
            "teamId" UUID NOT NULL REFERENCES public.teams("id"),
            "email" TEXT,
            "name" TEXT NOT NULL,
            "avatarUrl" TEXT,
            "language" TEXT,
            "role" public.user_role NOT NULL DEFAULT 'member',
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3),
            "suspendedAt" TIMESTAMP(3)
          );
          CREATE TABLE public.groups (
            "id" UUID PRIMARY KEY,
            "teamId" UUID NOT NULL REFERENCES public.teams("id"),
            "name" TEXT NOT NULL,
            "description" TEXT,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3)
          );
          CREATE TABLE public.group_users (
            "groupId" UUID NOT NULL REFERENCES public.groups("id"),
            "userId" UUID NOT NULL REFERENCES public.users("id"),
            PRIMARY KEY ("groupId", "userId")
          );
          INSERT INTO public.teams("id", "name")
          VALUES ('11111111-1111-4111-8111-111111111111', 'QuickTickets');
          INSERT INTO public.users("id", "teamId", "email", "name", "role")
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'admin@example.com', 'Смирнов Иван Владимирович', 'admin'
          );
          SQL
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 \
            -f tests/schema/outline-schedule-contract.sql
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 \
            -f tests/schema/month-planning-contract.sql

      - name: Validate planning constraints
        run: |
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO schedule.month_planning_periods(
            "id", "organizationId", "divisionId", "year", "month", "createdById"
          ) VALUES (
            'period-2026-08',
            '11111111-1111-4111-8111-111111111111',
            '44444444-4444-4444-8444-444444444444',
            2026, 8,
            '22222222-2222-4222-8222-222222222222'
          );
          INSERT INTO schedule.month_planning_preferences(
            "id", "periodId", "userId", "comment"
          ) VALUES (
            'preference-1', 'period-2026-08',
            '22222222-2222-4222-8222-222222222222',
            'Больше утренних смен'
          );
          INSERT INTO schedule.month_planning_preference_items(
            "id", "preferenceId", "workDate", "kind", "shiftTemplateCode"
          ) VALUES (
            'preference-item-1', 'preference-1', '2026-08-03',
            'PREFERRED', '04-00_12-30'
          );
          INSERT INTO schedule.month_planning_assignments(
            "id", "periodId", "userId", "workDate", "shiftTemplateCode", "createdById"
          ) VALUES (
            'assignment-1', 'period-2026-08',
            '22222222-2222-4222-8222-222222222222',
            '2026-08-03', '04-00_12-30',
            '22222222-2222-4222-8222-222222222222'
          );
          SQL

          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM schedule.month_planning_periods;")" = "1"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM schedule.month_planning_preferences;")" = "1"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM schedule.month_planning_assignments;")" = "1"

          if psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 -c \
            "INSERT INTO schedule.month_planning_assignments(\"id\",\"periodId\",\"userId\",\"workDate\",\"shiftTemplateCode\") VALUES ('duplicate','period-2026-08','22222222-2222-4222-8222-222222222222','2026-08-03','12-30_21-00');"; then
            echo "Duplicate daily assignment was accepted"
            exit 1
          fi
