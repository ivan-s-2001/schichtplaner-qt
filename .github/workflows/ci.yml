name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outline
      DATABASE_SCHEMA: schedule
      NEXTAUTH_SECRET: ci-nextauth-secret
      SCHEDULE_SSO_SECRET: ci-outline-sso-secret
      ALLOW_EMAIL_LOGIN: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          mkdir -p ../outline.qt.local
          touch ../outline.qt.local/.env
          cp .env.symbiosis.example .env.symbiosis
          docker compose --env-file .env.symbiosis -f docker-compose.symbiosis.yml config >/dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > tsc.log 2>&1
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc.log
      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome != 'success'
        run: |
          cat tsc.log
          exit 1
      - run: npm run build

      - name: Build Schedule Docker image without external build arguments
        run: docker build --target builder -t schedule-ci .

  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outline
          POSTGRES_PASSWORD: outline
          POSTGRES_DB: outline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outline -d outline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: outline
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create minimal Outline schema
        run: |
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TYPE public.user_role AS ENUM ('admin', 'member');

          CREATE TABLE public.teams (
            "id" UUID PRIMARY KEY,
            "name" TEXT NOT NULL,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3)
          );

          CREATE TABLE public.users (
            "id" UUID PRIMARY KEY,
            "teamId" UUID NOT NULL REFERENCES public.teams("id"),
            "email" TEXT,
            "name" TEXT NOT NULL,
            "avatarUrl" TEXT,
            "language" TEXT,
            "role" public.user_role NOT NULL DEFAULT 'member',
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3),
            "suspendedAt" TIMESTAMP(3)
          );

          CREATE TABLE public.groups (
            "id" UUID PRIMARY KEY,
            "teamId" UUID NOT NULL REFERENCES public.teams("id"),
            "name" TEXT NOT NULL,
            "description" TEXT,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3)
          );

          CREATE TABLE public.group_users (
            "groupId" UUID NOT NULL REFERENCES public.groups("id"),
            "userId" UUID NOT NULL REFERENCES public.users("id"),
            PRIMARY KEY ("groupId", "userId")
          );

          INSERT INTO public.teams("id", "name")
          VALUES ('11111111-1111-4111-8111-111111111111', 'QuickTickets');

          INSERT INTO public.users("id", "teamId", "email", "name", "role")
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'admin@example.com',
            'Смирнов Иван Владимирович',
            'admin'
          );

          INSERT INTO public.groups("id", "teamId", "name", "description")
          VALUES (
            '33333333-3333-4333-8333-333333333333',
            '11111111-1111-4111-8111-111111111111',
            'Доступ к документам',
            'Не является подразделением'
          );

          INSERT INTO public.group_users("groupId", "userId")
          VALUES (
            '33333333-3333-4333-8333-333333333333',
            '22222222-2222-4222-8222-222222222222'
          );
          SQL

      - name: Apply schedule schema contract
        run: psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 -f tests/schema/outline-schedule-contract.sql

      - name: Validate independent scheduling data
        run: |
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT relkind FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='schedule' AND c.relname='users';")" = "v"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT relkind FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='schedule' AND c.relname='divisions';")" = "r"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT relkind FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='schedule' AND c.relname='division_members';")" = "r"

          DIRECT_FKS=$(psql -h localhost -U outline -d outline -Atc "
            SELECT COUNT(*)
            FROM pg_constraint c
            JOIN pg_class source_table ON source_table.oid=c.conrelid
            JOIN pg_namespace source_schema ON source_schema.oid=source_table.relnamespace
            JOIN pg_class target_table ON target_table.oid=c.confrelid
            JOIN pg_namespace target_schema ON target_schema.oid=target_table.relnamespace
            WHERE c.contype='f'
              AND source_schema.nspname='schedule'
              AND target_schema.nspname='public'
              AND target_table.relname IN ('users','teams');
          ")
          test "$DIRECT_FKS" -ge 10

          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM schedule.users;")" = "1"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT \"lastName\" || ' ' || \"firstName\" || ' ' || \"patronymic\" FROM schedule.users;")" = "Смирнов Иван Владимирович"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM schedule.divisions;")" = "1"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM schedule.division_members;")" = "1"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM schedule.divisions d JOIN public.groups g ON g.\"id\"=d.\"id\";")" = "0"

          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO schedule.divisions("id", "organizationId", "title")
          VALUES (
            '55555555-5555-4555-8555-555555555555',
            '11111111-1111-4111-8111-111111111111',
            'Тестировщики'
          );
          SQL

          if psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 -c "
            INSERT INTO schedule.division_members(\"divisionId\",\"userId\")
            VALUES (
              '55555555-5555-4555-8555-555555555555',
              '22222222-2222-4222-8222-222222222222'
            );
          "; then
            echo "A user was assigned to two divisions"
            exit 1
          fi
