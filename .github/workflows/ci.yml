name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/outline
      DATABASE_SCHEMA: schedule
      NEXTAUTH_SECRET: ci-nextauth-secret
      SCHEDULE_SSO_SECRET: ci-outline-sso-secret
      ALLOW_EMAIL_LOGIN: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > tsc.log 2>&1
      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc.log
      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome != 'success'
        run: |
          cat tsc.log
          exit 1
      - run: npm run build
