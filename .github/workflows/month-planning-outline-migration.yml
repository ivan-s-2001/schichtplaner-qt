name: Month planning Outline migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/month-planning-outline-migration.yml"
      - "src/app/api/month-planning/**"
      - "src/lib/month-planning.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/month-planning-outline-migration.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: outline
          POSTGRES_PASSWORD: outline
          POSTGRES_DB: outline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U outline -d outline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: outline

    steps:
      - name: Checkout Schedule
        uses: actions/checkout@v4

      - name: Download exact Outline migration
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/ivan-s-2001/Outline-osp/d3e07cde49fb1486e65cde6b99256e066177ed2d/server/migrations/20260719128000-create-month-planning.js \
            --output /tmp/create-month-planning.js
          test -s /tmp/create-month-planning.js

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create current schedule schema
        run: |
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TYPE public.user_role AS ENUM ('admin', 'member');
          CREATE TABLE public.teams (
            "id" UUID PRIMARY KEY,
            "name" TEXT NOT NULL,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3)
          );
          CREATE TABLE public.users (
            "id" UUID PRIMARY KEY,
            "teamId" UUID NOT NULL REFERENCES public.teams("id"),
            "email" TEXT,
            "name" TEXT NOT NULL,
            "avatarUrl" TEXT,
            "language" TEXT,
            "role" public.user_role NOT NULL DEFAULT 'member',
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "updatedAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3),
            "suspendedAt" TIMESTAMP(3)
          );
          CREATE TABLE public.groups (
            "id" UUID PRIMARY KEY,
            "teamId" UUID NOT NULL REFERENCES public.teams("id"),
            "name" TEXT NOT NULL,
            "description" TEXT,
            "createdAt" TIMESTAMP(3) NOT NULL DEFAULT CURRENT_TIMESTAMP,
            "deletedAt" TIMESTAMP(3)
          );
          CREATE TABLE public.group_users (
            "groupId" UUID NOT NULL REFERENCES public.groups("id"),
            "userId" UUID NOT NULL REFERENCES public.users("id"),
            PRIMARY KEY ("groupId", "userId")
          );
          INSERT INTO public.teams("id", "name")
          VALUES ('11111111-1111-4111-8111-111111111111', 'QuickTickets');
          INSERT INTO public.users("id", "teamId", "email", "name", "role")
          VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'admin@example.com', 'Смирнов Иван Владимирович', 'admin'
          );
          INSERT INTO public.groups("id", "teamId", "name", "description")
          VALUES (
            '33333333-3333-4333-8333-333333333333',
            '11111111-1111-4111-8111-111111111111',
            'Доступ к документам', 'Не является подразделением'
          );
          INSERT INTO public.group_users("groupId", "userId")
          VALUES (
            '33333333-3333-4333-8333-333333333333',
            '22222222-2222-4222-8222-222222222222'
          );
          SQL
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 \
            -f tests/schema/outline-schedule-contract.sql

      - name: Extract and apply exact Outline migration
        run: |
          node <<'NODE' > /tmp/month-planning.sql
          const migration = require('/tmp/create-month-planning.js');
          const statements = [];
          const queryInterface = {
            sequelize: {
              transaction: async (callback) => callback({}),
              query: async (sql) => statements.push(sql),
            },
          };
          (async () => {
            await migration.up(queryInterface);
            process.stdout.write(statements.join('\n'));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          psql -h localhost -U outline -d outline -v ON_ERROR_STOP=1 \
            -f /tmp/month-planning.sql

      - name: Validate month planning migration
        run: |
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='schedule' AND table_name IN ('month_planning_periods','month_planning_preferences','month_planning_preference_items','month_planning_assignments');")" = "4"
          test "$(psql -h localhost -U outline -d outline -Atc "SELECT COUNT(*) FROM pg_type t JOIN pg_namespace n ON n.oid=t.typnamespace WHERE n.nspname='schedule' AND t.typname IN ('MonthPlanningStatus','MonthPreferenceKind');")" = "2"
