name: outline-schedule

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: outline
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - shared_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

  outline:
    build:
      context: ../outline.qt.local
      dockerfile: Dockerfile.symbiosis
    env_file:
      - ../outline.qt.local/.env
      - ./.env.symbiosis
    environment:
      NODE_ENV: production
      PORT: 3000
      URL: ${OUTLINE_URL:-https://outline.qt.local}
      DEFAULT_LANGUAGE: ${OUTLINE_DEFAULT_LANGUAGE:-en_US}
      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}
      DATABASE_URL: postgresql://outline:${POSTGRES_PASSWORD}@postgres:5432/outline
      PGSSLMODE: disable
      REDIS_URL: redis://redis:6379/0
      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
      FORCE_HTTPS: "false"
      PROXY_HEADERS_TRUSTED: "true"
      SCHEDULE_URL: ${SCHEDULE_URL:-https://schedule.qt.local}
      SCHEDULE_SSO_SECRET: ${SCHEDULE_SSO_SECRET}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_FROM_EMAIL: "Outline <outline@local.test>"
      SMTP_REPLY_EMAIL: "Outline <outline@local.test>"
    command:
      - sh
      - -c
      - ./node_modules/.bin/sequelize db:migrate --env production-ssl-disabled && node build/server/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "127.0.0.1:${OUTLINE_PORT:-3000}:3000"
    volumes:
      - outline_file_data:/var/lib/outline/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/_health | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  schedule:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env.symbiosis
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://outline:${POSTGRES_PASSWORD}@postgres:5432/outline
      DATABASE_SCHEMA: schedule
      OUTLINE_URL: ${OUTLINE_URL:-https://outline.qt.local}
      NEXTAUTH_URL: ${SCHEDULE_URL:-https://schedule.qt.local}
      AUTH_URL: ${SCHEDULE_URL:-https://schedule.qt.local}
      APP_URL: ${SCHEDULE_URL:-https://schedule.qt.local}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      SCHEDULE_SSO_SECRET: ${SCHEDULE_SSO_SECRET}
      ALLOW_EMAIL_LOGIN: "false"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      outline:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCHEDULE_PORT:-41873}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    container_name: outline-schedule-proxy
    environment:
      OUTLINE_DOMAIN: ${OUTLINE_DOMAIN:-outline.qt.local}
      SCHEDULE_DOMAIN: ${SCHEDULE_DOMAIN:-schedule.qt.local}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.symbiosis:/etc/caddy/Caddyfile:ro
      - shared_caddy_data:/data
      - shared_caddy_config:/config
    depends_on:
      outline:
        condition: service_healthy
      schedule:
        condition: service_healthy
    restart: unless-stopped

volumes:
  shared_postgres_data:
  shared_redis_data:
  outline_file_data:
  shared_caddy_data:
  shared_caddy_config:
